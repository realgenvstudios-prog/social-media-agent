[build]
builder = "dockerfile"
dockerfilePath = "Dockerfile"

# This file defines one service — duplicate in Railway dashboard for each cron job.
# Environment variables to set in Railway (never commit .env):
#   SUPABASE_URL, SUPABASE_KEY, ANTHROPIC_API_KEY
#   POSTER_A_FACEBOOK_EMAIL, POSTER_A_FACEBOOK_PASSWORD
#   POSTER_A_TIKTOK_EMAIL, POSTER_A_TIKTOK_PASSWORD
#   POSTER_A_YOUTUBE_EMAIL, POSTER_A_YOUTUBE_PASSWORD
#   HEADLESS=true
#   WHISPER_MODEL=base

# ── Cron schedules ─────────────────────────────────────────────────────────
# Service         Start command                    Cron
# watcher-a       python3 watcher.py a             0 */6 * * *   (every 6h)
# clipper-a       python3 clipper.py a             */30 * * * *  (every 30m) — also handles watch_manual jobs
# poster-tiktok-a python3 poster_tiktok.py a       0 */4 * * *   (every 4h)
# poster-yt-a     python3 poster_youtube.py a      0 */4 * * *   (every 4h)
# poster-fb-a     python3 poster_facebook.py a     0 */4 * * *   (every 4h)

[deploy]
restartPolicyType = "never"
